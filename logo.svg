<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="box">
      <rect width="200" height="200" rx="34" ry="34"/>
    </clipPath>
  </defs>
  <!-- CS Palmtree background (#0CAEA1) -->
  <rect width="200" height="200" rx="34" ry="34" fill="#0CAEA1"/>
  <!-- CS lettering — Century Gothic / Trebuchet give the rounded geometric look -->
  <g clip-path="url(#box)">
    <text x="100" y="108"
          font-family="'Century Gothic','Trebuchet MS','Gill Sans MT','Gill Sans',Tahoma,sans-serif"
          font-weight="800"
          font-size="96"
          fill="white"
          text-anchor="middle"
          letter-spacing="4">CS</text>
  </g>
  <!-- Campana Schott label -->
  <text x="100" y="144"
        font-family="'Century Gothic','Trebuchet MS','Gill Sans MT','Gill Sans',Tahoma,sans-serif"
        font-weight="700"
        font-size="18"
        fill="white"
        text-anchor="middle"
        letter-spacing="0.5">Campana</text>
  <text x="100" y="166"
        font-family="'Century Gothic','Trebuchet MS','Gill Sans MT','Gill Sans',Tahoma,sans-serif"
        font-weight="700"
        font-size="18"
        fill="white"
        text-anchor="middle"
        letter-spacing="0.5">Schott</text>
</svg>
